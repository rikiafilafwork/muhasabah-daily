# Muhasabah Daily: semua layanan.
#
#   docker compose up -d           # jalankan semuanya, lalu buka http://localhost:8080
#   docker compose up -d db redis  # hanya basis data dan Redis (pengembangan dengan `pnpm dev`)
#
# `.env` opsional untuk mode container: secret JWT dibuat otomatis bila kosong.
name: muhasabah-daily

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muhasabah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muhasabah}
      POSTGRES_DB: ${POSTGRES_DB:-muhasabah}
    ports:
      # Hanya dari mesin ini (untuk `pnpm dev`); tidak terbuka ke jaringan.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-muhasabah}:${POSTGRES_PASSWORD:-muhasabah}@db:5432/${POSTGRES_DB:-muhasabah}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - api-secrets:/app/secrets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  api-secrets:
