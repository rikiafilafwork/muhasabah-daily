version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-dan-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # NestJS sengaja di versi 11 karena nestjs-zod belum mendukung 12.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      # Tipe Node mengikuti Node LTS yang dipakai (24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript mayor dinaikkan manual setelah diuji.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: monthly
    ignore:
      # Tetap di Node LTS; naik versi mayor dilakukan manual saat LTS berikutnya rilis.
      - dependency-name: node
        update-types: [version-update:semver-major]
